<!--
  OneLGU branded email template for the Resend Template editor.
  Paste this whole file into Resend → Templates → HTML code editor.

  Resend template variables (fill these when sending, or in the editor preview):
    {{heading}}      e.g. "Your certificate is ready"
    {{message}}      main body text (can be a sentence or two)
    {{button_label}} e.g. "View in OneLGU"     (optional — remove the button block if unused)
    {{button_url}}   e.g. https://one-lgu.vercel.app/resident/certifications
    {{preview_text}} short inbox preview line

  NOTE: the logo loads from the deployed site. If your production domain
  changes, update the <img src> below.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneLGU</title>
</head>
<body style="margin:0; padding:0; background-color:#F8FDF9; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; color:#143D2A;">
  <span style="display:none; font-size:1px; color:#F8FDF9; max-height:0; max-width:0; opacity:0; overflow:hidden;">{{preview_text}}</span>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8FDF9; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background-color:#ffffff; border:1px solid #E3F2E7; border-radius:16px; overflow:hidden;">

          <!-- Header with OneLGU logo -->
          <tr>
            <td style="padding:28px 32px 20px; border-bottom:1px solid #E3F2E7;">
              <img src="https://usvcpgohfhaqngcgsleq.supabase.co/storage/v1/object/public/attachments/brand/one_lgu_email.png" width="64" height="64" alt="OneLGU" style="display:block; border:0; width:64px; height:64px;" />
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:28px 32px;">
              <h1 style="margin:0 0 16px; font-size:20px; line-height:1.3; font-weight:700; color:#143D2A;">{{heading}}</h1>
              <p style="margin:0; font-size:15px; line-height:1.7; color:#3f5249;">{{message}}</p>

              <!-- Call-to-action button (remove this table if not needed) -->
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0 8px;">
                <tr>
                  <td style="border-radius:999px; background-color:#00B15E;">
                    <a href="{{button_url}}" style="display:inline-block; padding:12px 28px; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:999px;">{{button_label}}</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 32px 28px; border-top:1px solid #E3F2E7; background-color:#FAFDFB;">
              <p style="margin:0; font-size:12px; line-height:1.6; color:#8a9a90;">
                OneLGU — Digital Portal for the Municipality of Dingras, Ilocos Norte.<br />
                This is an automated message. Please do not reply directly to this email.
              </p>
            </td>
          </tr>

        </table>
        <p style="margin:16px 0 0; font-size:11px; color:#b0bdb5;">&copy; 2026 OneLGU Project &middot; Ilocos Norte</p>
      </td>
    </tr>
  </table>
</body>
</html>
